<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${question.title}">질문 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${question.title}">제목</h2>
        <span class="badge bg-secondary" th:text="${question.category.name}">카테고리</span>
    </div>

    <div class="d-flex justify-content-between text-muted small border-bottom pb-2 mb-3">
        <div>
            작성자: <span th:text="${question.member.nickname}">닉네임</span>
        </div>
        <div>
            조회수 <span th:text="${question.viewCount}">0</span>
            <span class="ms-3">작성일 <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span></span>
        </div>
    </div>

    <div class="mb-4" style="min-height: 200px; white-space: pre-wrap;" th:text="${question.content}">
        내용
    </div>

    <div class="d-flex justify-content-between">
        <a href="/questions/list" class="btn btn-outline-secondary">목록</a>
        <div th:if="${isAuthor}">
            <a th:href="@{'/questions/edit/' + ${question.id}}" class="btn btn-outline-primary">수정</a>
            <form th:action="@{'/questions/delete/' + ${question.id}}" method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?');"
                  class="d-inline">
                <button type="submit" class="btn btn-outline-danger">삭제</button>
            </form>
        </div>
    </div>

    <!-- 답변 영역 임시 비활성화
    <div th:replace="~{answer/list :: answerSection}"></div>

    <th:block th:replace="~{answer/list :: answerScript}"></th:block>
-->
</div>
</body>
</html>
